<body>
    <header class="header">
        <div class="carousel">
            <img src="./image/brooke-lark-3A1etBW5cBk-unsplash.png" alt="a" class="bg-image active">
            <img src="./image/OIP (1).jpg" alt="a" class="bg-image">
            <img src="./image/tropical-fruits-mango-papaya-orange-background.jpg" alt="a" class="bg-image">
            <div class="overlay"></div>
        </div>
        <script>
            let currentIndex = 0;
            const images = document.querySelectorAll('.bg-image');

            function showNextImage() {
                images[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % images.length;
                images[currentIndex].classList.add('active');
            }

            setInterval(showNextImage, 7000);
        </script>
        <div class="title">
            <h1>NINOM</h1>
        </div>

        <button class="arrow left">‹</button>
        <button class="arrow right">›</button>

        <nav class="nav">

                    <a href="testimonial.html">Testimonial</a>
                    <a href="call.html">Contact Us</a>

                    <button><img src="icons/ss.png" alt="a"></button>
                </div>
            </div>
        </nav>
    </header>

    <div class="callback-container">
        <div class="callback-header">
            <div class="header-line"></div>
            <h1 class="callback-title">Request A call back</h1>
        </div>

        <div class="callback-content">
            <div class="form-section">
                <form class="callback-form">
                    <div class="input-group">
                        <input type="text" class="form-input" placeholder="FULL NAME" required>
                    </div>

                    <div class="input-group">
                        <input type="email" class="form-input" placeholder="EMAIL" required>
                    </div>

                    <div class="input-group">
                        <input type="tel" class="form-input" placeholder="PHONE NUMBER" required>
                    </div>

                    <div class="input-group">
                        <textarea class="form-textarea" placeholder="MESSAGE" rows="6"></textarea>
                    </div>

                    <button type="submit" class="submit-button">SEND</button>
                </form>
            </div>

            <div class="map-section">
                <div class="map-container">
                    <iframe class="embedded-map"
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3048.4!2d-74.0059!3d40.7128!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDDCsDQyJzQ2LjEiTiA3NMKwMDAnMjEuMiJX!5e0!3m2!1sen!2sus!4v1234567890"
                        allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>
    </div>
